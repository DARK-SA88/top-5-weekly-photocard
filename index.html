<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BCT Ultimate Ranking Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030000;
            --red-accent: #ff1a1a;
        }

        body {
            background-color: var(--bg-deep);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            overscroll-behavior-y: none;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .smooth-scroll {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .smooth-scroll::-webkit-scrollbar { width: 5px; }
        .smooth-scroll::-webkit-scrollbar-track { background: transparent; }
        .smooth-scroll::-webkit-scrollbar-thumb { background: #4a0000; border-radius: 10px; }
        .smooth-scroll::-webkit-scrollbar-thumb:hover { background: var(--red-accent); }

        .glass-input {
            background: rgba(20, 0, 0, 0.6);
            border: 1px solid rgba(255, 50, 50, 0.2);
            color: white;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .glass-input:focus {
            border-color: var(--red-accent);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
            outline: none;
            background: rgba(30, 0, 0, 0.8);
        }

        .visual-area {
            background: radial-gradient(circle at center, #1a0000 0%, #030000 100%);
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            z-index: 20;
        }

        .dashboard-area {
            background: linear-gradient(180deg, #0a0000 0%, #050000 100%);
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- VISUAL PREVIEW AREA -->
    <div class="visual-area h-[45vh] lg:h-[55vh] w-full flex items-center justify-center p-4 border-b border-red-900/40 relative">
        <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: linear-gradient(#ff0000 1px, transparent 1px), linear-gradient(90deg, #ff0000 1px, transparent 1px); background-size: 20px 20px;"></div>
        
        <div class="relative h-full aspect-[4/5] rounded-xl overflow-hidden ring-1 ring-red-900/30 shadow-[0_0_30px_rgba(255,0,0,0.05)] bg-[#050000]">
            <!-- Perfect 4:5 Portrait Ratio for Facebook/Insta -->
            <canvas id="posterCanvas" width="1080" height="1350" class="w-full h-full object-contain block"></canvas>
        </div>
    </div>

    <!-- DASHBOARD CONTROLS (SIMPLIFIED) -->
    <div class="dashboard-area h-[55vh] lg:h-[45vh] w-full overflow-y-auto smooth-scroll relative pb-28 pt-6 px-4 md:px-8">
        <div class="max-w-4xl mx-auto space-y-6">
            
            <div class="text-center mb-8 relative">
                <h1 class="text-3xl text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-red-700 font-bold tracking-[0.2em]" style="font-family: 'Bebas Neue', sans-serif;">
                    STUDIO DASHBOARD
                </h1>
                <p class="text-gray-500 text-[11px] uppercase tracking-widest mt-1 font-light">Fast & Clean Live Editor</p>
            </div>

            <!-- Global Settings -->
            <div class="bg-black/40 backdrop-blur-md p-5 rounded-2xl border border-red-900/30">
                <label class="block text-red-500/80 text-[10px] font-semibold mb-2 tracking-[0.2em] uppercase">Main Title</label>
                <input type="text" id="mainTitle" value="WEEKLY TOP 5 RANKING" class="glass-input w-full rounded-xl p-3 text-center text-lg font-medium tracking-wider uppercase" oninput="queueRender()">
            </div>

            <!-- Profiles Container -->
            <div id="profilesContainer" class="space-y-5"></div>
        </div>
    </div>

    <!-- FLOATING EXPORT BUTTON -->
    <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black via-black/90 to-transparent z-30 flex justify-center backdrop-blur-sm">
        <button onclick="exportHD()" class="w-full max-w-4xl bg-gradient-to-r from-red-800 to-red-600 hover:from-red-600 hover:to-red-500 text-white font-medium py-4 px-6 rounded-2xl shadow-[0_5px_20px_rgba(255,0,0,0.25)] transition-all flex items-center justify-center text-lg tracking-widest active:scale-[0.98] border border-red-500/30">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            <span style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 3px; font-size: 22px;">DOWNLOAD HD POSTER</span>
        </button>
    </div>

    <script>
        const canvas = document.getElementById('posterCanvas');
        const ctx = canvas.getContext('2d');
        let renderFrameId = null;

        const teamLogo = new Image();
        teamLogo.crossOrigin = "Anonymous";
        teamLogo.src = "https://i.ibb.co/Y72LMbdQ/20260502-163657.png";
        teamLogo.onload = () => queueRender();

        // State without zoom/move variables
        const appState = {
            title: "WEEKLY TOP 5 RANKING",
            profiles: [
                { id: "p1", rank: "TOP-1", name: "NULL", code: "", img: null, x: 540, y: 360, r: 145 },
                { id: "p2", rank: "TOP-2", name: "NULL", code: "", img: null, x: 270, y: 740, r: 130 },
                { id: "p3", rank: "TOP-3", name: "NULL", code: "", img: null, x: 810, y: 740, r: 130 },
                { id: "p4", rank: "TOP-4", name: "NULL", code: "", img: null, x: 330, y: 1100, r: 120 },
                { id: "p5", rank: "TOP-5", name: "NULL", code: "", img: null, x: 750, y: 1100, r: 120 }
            ]
        };

        function buildDashboard() {
            const container = document.getElementById('profilesContainer');
            appState.profiles.forEach((p, idx) => {
                const num = idx + 1;
                // Simplified HTML for each profile
                const html = `
                    <div class="bg-black/40 backdrop-blur-sm p-5 rounded-2xl border border-red-900/20 shadow-lg transition-all hover:border-red-900/50">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center">
                                <span class="bg-red-900/80 text-white px-3 py-1 rounded-md text-xs font-semibold tracking-widest shadow-lg mr-3 border border-red-700/50">TOP ${num}</span>
                            </div>
                        </div>
                        
                        <div class="space-y-4">
                            <div class="relative w-full">
                                <input type="file" id="file-${idx}" accept="image/*" class="hidden" onchange="handleUpload(event, ${idx})">
                                <label for="file-${idx}" class="w-full flex items-center justify-center px-4 py-3 bg-[#0f0000] text-red-400 rounded-xl border border-red-900/40 hover:bg-red-900/80 hover:text-white transition-all cursor-pointer text-xs font-medium tracking-widest uppercase shadow-inner">
                                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                                    CHOOSE PHOTO (1:1 RECOMMENDED)
                                </label>
                            </div>
                            
                            <div class="flex gap-3">
                                <div class="w-[70%]">
                                    <label class="block text-[9px] text-gray-500 mb-1 uppercase tracking-widest pl-1">Name</label>
                                    <input type="text" placeholder="E.g. ALMAN" value="" class="glass-input w-full rounded-xl p-3 text-sm font-light uppercase" oninput="updateData(${idx}, 'name', this.value)">
                                </div>
                                <div class="w-[30%]">
                                    <label class="block text-[9px] text-gray-500 mb-1 uppercase tracking-widest pl-1">Code</label>
                                    <input type="text" placeholder="S-13" value="" class="glass-input w-full rounded-xl p-3 text-sm font-light uppercase text-center" oninput="updateData(${idx}, 'code', this.value)">
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        document.getElementById('mainTitle').addEventListener('input', (e) => {
            appState.title = e.target.value.toUpperCase();
            queueRender();
        });

        function updateData(index, field, value) {
            appState.profiles[index][field] = value.toUpperCase();
            queueRender();
        }

        function handleUpload(event, index) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        appState.profiles[index].img = img;
                        queueRender();
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function queueRender() {
            if (renderFrameId) cancelAnimationFrame(renderFrameId);
            renderFrameId = requestAnimationFrame(drawCanvas);
        }

        function drawCanvas() {
            const w = canvas.width;
            const h = canvas.height;

            // Deep Dark Background
            ctx.fillStyle = '#030000';
            ctx.fillRect(0, 0, w, h);

            const spotlight = ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, 800);
            spotlight.addColorStop(0, 'rgba(40, 0, 0, 0.6)');
            spotlight.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = spotlight;
            ctx.fillRect(0, 0, w, h);

            drawTitle(appState.title, w/2, 100);

            appState.profiles.forEach(p => drawProfile(p));

            if(teamLogo.complete && teamLogo.naturalWidth > 0) {
                ctx.save();
                const maxLogoSize = 90; 
                const paddingRight = 40;
                const paddingTop = 30;
                
                const logoX = w - maxLogoSize - paddingRight; 
                const logoY = paddingTop;
                
                const ratio = Math.min(maxLogoSize / teamLogo.naturalWidth, maxLogoSize / teamLogo.naturalHeight);
                const finalW = teamLogo.naturalWidth * ratio;
                const finalH = teamLogo.naturalHeight * ratio;

                const dx = logoX + (maxLogoSize - finalW)/2;
                const dy = logoY + (maxLogoSize - finalH)/2;

                ctx.shadowColor = 'rgba(255, 0, 0, 0.2)';
                ctx.shadowBlur = 10;
                ctx.drawImage(teamLogo, dx, dy, finalW, finalH);
                ctx.restore();
            }
        }

        function drawTitle(text, x, y) {
            ctx.save();
            const maxBoxWidth = 620; 
            const boxH = 80;
            const cx = x - maxBoxWidth/2;
            const cy = y - boxH/2;

            ctx.fillStyle = 'rgba(10, 0, 0, 0.8)';
            ctx.beginPath();
            ctx.roundRect(cx, cy, maxBoxWidth, boxH, 8);
            ctx.fill();

            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 50, 50, 0.8)';
            ctx.stroke();

            ctx.font = '55px "Bebas Neue"';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.letterSpacing = "2px";
            ctx.fillText(text, x, y + 4); 
            ctx.restore();
        }

        function drawProfile(p) {
            ctx.save();

            ctx.shadowColor = 'rgba(255, 0, 0, 0.15)';
            ctx.shadowBlur = 30;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.closePath();

            if (p.img) {
                ctx.save();
                ctx.clip(); 
                
                // Simplified scaling (Auto cover)
                const scale = Math.max((p.r * 2) / p.img.width, (p.r * 2) / p.img.height);
                const drawW = p.img.width * scale;
                const drawH = p.img.height * scale;
                
                // Centered perfectly
                const drawX = p.x - drawW / 2;
                const drawY = p.y - drawH / 2;

                ctx.drawImage(p.img, drawX, drawY, drawW, drawH);
                ctx.restore();
            } else {
                ctx.fillStyle = '#080000';
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.font = '300 24px "Poppins"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.letterSpacing = "4px";
                ctx.fillText("IMAGE", p.x, p.y);
            }

            // Elegant Borders
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r - 8, 0, Math.PI * 2);
            ctx.stroke();

            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ff1a1a';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();

            ctx.textAlign = 'center';
            
            const badgeW = 110;
            const badgeH = 28;
            const badgeY = p.y + p.r + 20; 
            
            ctx.fillStyle = 'rgba(255, 20, 20, 0.15)';
            ctx.strokeStyle = 'rgba(255, 50, 50, 0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(p.x - badgeW/2, badgeY, badgeW, badgeH, 14);
            ctx.fill();
            ctx.stroke();

            ctx.font = '500 14px "Poppins"';
            ctx.fillStyle = '#ff6666';
            ctx.letterSpacing = "1px";
            ctx.textBaseline = 'middle';
            ctx.fillText(p.rank, p.x, badgeY + badgeH/2 + 1);
            
            const nameY = badgeY + badgeH + 20; 
            
            let displayName = p.name === "" ? "NULL" : p.name;
            if (p.code && p.code !== "") {
                displayName += ` | ${p.code}`; 
            }

            ctx.font = '300 24px "Poppins"';
            ctx.fillStyle = '#ffffff';
            ctx.letterSpacing = "1px";
            ctx.fillText(displayName, p.x, nameY, 280); 
        }

        function exportHD() {
            try {
                const link = document.createElement('a');
                link.download = 'BCT_Rankings_Ultimate.png';
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            } catch (error) {
                alert("Security block (CORS): To save, please right-click or long-press the canvas image and select 'Save Image'.");
            }
        }

        document.fonts.ready.then(() => {
            buildDashboard();
            queueRender();
        });
    </script>
</body>
</html>
